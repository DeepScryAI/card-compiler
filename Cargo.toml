[package]
name = "cardskin"
version = "0.1.0"
edition = "2021"
# NOTE: license intentionally left unset. DeepScry's own repo is
# proprietary; card-scripts-mirror is GPLv3 (inherited from Forge). This
# repo's license is an open question for the owner, not something to guess
# at — set it explicitly before any external consumer or publish step.
description = "Index-compiling machinery for DeepScry's card-skin art index: the SCDT binary wire format and the build-time generator that produces it from Scryfall data."

[features]
default = []
# Build-time machinery: the Scryfall record parser (builder.rs) and the
# bulk-fetch/cache helper (bulk_fetch.rs). Off by default
# so a consumer that only wants the wire format (e.g. a wasm client
# decoding an already-built table) pulls zero extra dependencies — `wire`
# itself needs nothing beyond `std`.
builder = ["dep:serde", "dep:serde_json", "dep:reqwest", "dep:flate2", "dep:log"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
# The remaining four are `bulk_fetch`'s, added when that module got real
# content rather than in advance, so this file never claims a dependency
# nothing here uses.
#
# `reqwest` is pinned to rustls with default features off to match the
# consuming DeepScry CLI's own configuration -- a second TLS stack in one
# binary is a real cost, and default-features would pull native-tls.
#
# There is deliberately NO `tokio` here. `ensure_cache` is `async` for
# reqwest's sake, but every filesystem operation uses `std::fs`, so the
# caller supplies the runtime and this crate does not depend on one.
serde_json = { version = "1.0", optional = true }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false, optional = true }
flate2 = { version = "1.1", optional = true }
log = { version = "0.4", optional = true }
